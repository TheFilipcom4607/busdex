name: Refresh fleet data

# Rebuilds fleet.json from the city's vehicle list and commits it when the fleet changed.
# The app downloads the committed file from raw.githubusercontent.com, so new deliveries
# reach phones without an App Store release.
#
# Manual only, and it needs the TABOR_DANE_TOKEN repo secret: fetch_fleet.py now builds from
# the city's open-data vehicle list (dane.um.warszawa.pl) on top of the last ZTM scrape. The
# scrape itself (--scrape) can't run here: ztm.waw.pl answers GitHub's runners with an AWS
# WAF bot challenge (seen 2026-09-25). Running `python3 scripts/fetch_fleet.py` from a home
# connection and committing is the usual way.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fleet-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the city's vehicle list and rebuild fleet.json
        env:
          TABOR_DANE_TOKEN: ${{ secrets.TABOR_DANE_TOKEN }}
        run: python3 scripts/fetch_fleet.py

      - name: Commit if the fleet changed
        run: |
          set +e
          python3 scripts/fleet_changed.py
          status=$?
          set -e
          if [ "$status" = 1 ]; then
            echo "Only the snapshot date moved; nothing to commit."
            exit 0
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tabor/Resources/fleet.json data/ztm-pojazdy.json
          git commit -m "Refresh fleet data from ZTM ($(date -u +%F))"
          git push origin HEAD:main
