<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TABOR Fleet Stats</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0C0E'/%3E%3Crect x='7' y='16' width='4' height='9' rx='1' fill='%23E4002B'/%3E%3Crect x='14' y='10' width='4' height='15' rx='1' fill='%23FFCE00'/%3E%3Crect x='21' y='6' width='4' height='19' rx='1' fill='%2323E5A0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  color-scheme: dark;
  --bg: #0B0C0E; --card: #14161A; --chip: #1B1E23; --slot: #111317; --track: #23262B;
  --ink: #F7F5F0; --sub: #A3A8B0; --dim: #8A8F98; --faint: #6A6F77; --ghost: #3E444B;
  --hair: rgba(255,255,255,.07); --yellow: #FFCE00; --red: #E4002B;
  --grotesk: 'Space Grotesk', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--grotesk); }
body { -webkit-font-smoothing: antialiased; }
a { color: var(--yellow); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px 64px; }
.mono { font-family: var(--mono); text-transform: uppercase; letter-spacing: .12em; font-size: 11px; color: var(--dim); }
.num { font-variant-numeric: tabular-nums; }

header.top { position: sticky; top: 0; z-index: 1000; background: rgba(11,12,14,.88); backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--hair); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-top: 12px; padding-bottom: 12px; }
.brand { font-family: var(--mono); font-weight: 600; letter-spacing: .32em; font-size: 14px; }
.brand b { color: var(--yellow); font-weight: 600; }
.status { flex: 1; min-width: 200px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--sub);
  background: var(--chip); border: 1px solid var(--hair); border-radius: 999px; padding: 7px 12px; cursor: pointer; }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.chip .dot { margin-right: 6px; }

section { margin-top: 44px; }
section > .head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
section h2 { font-size: 28px; font-weight: 600; letter-spacing: -.01em; margin: 6px 0 0; }
section .lede { color: var(--sub); margin: 6px 0 0; max-width: 720px; line-height: 1.45; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(12, 1fr); }
.card { background: var(--card); border: 1px solid var(--hair); border-radius: 20px; padding: 18px; min-width: 0; }
.card h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.card .note { color: var(--dim); font-size: 13px; margin: 0 0 14px; line-height: 1.4; }
.s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s6 { grid-column: span 6; }
.s4 { grid-column: span 4; } .s3 { grid-column: span 3; } .s2 { grid-column: span 2; }
@media (max-width: 900px) { .s8, .s6, .s4 { grid-column: span 12; } .s3 { grid-column: span 6; } .s2 { grid-column: span 4; } }
@media (max-width: 560px) {
  .s3 { grid-column: span 6; } .s2 { grid-column: span 6; } section h2 { font-size: 23px; }
  .hide-sm { display: none; } header.top { position: static; } .hero .value { font-size: 52px; }
}

.tile .label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.tile .value { font-size: 34px; font-weight: 600; margin-top: 8px; letter-spacing: -.02em; line-height: 1; }
.tile .sub { color: var(--sub); font-size: 13px; margin-top: 8px; line-height: 1.35; }
.hero .value { font-size: 64px; }
.tile .bar { height: 6px; border-radius: 3px; background: var(--track); margin-top: 12px; overflow: hidden; }
.tile .bar i { display: block; height: 100%; border-radius: 3px; }

.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: 1px; flex: none; }
.key { display: inline-flex; align-items: center; gap: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--sub); margin: 0 0 12px; }
.legend .line { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--dim); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
th.sort { cursor: pointer; user-select: none; } th.sort:hover { color: var(--ink); }
th.on { color: var(--ink); }
td { padding: 9px 10px; border-bottom: 1px solid var(--hair); vertical-align: middle; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.click { cursor: pointer; } tr.click:hover td { background: rgba(255,255,255,.025); }
tr.sel td { background: rgba(255,206,0,.06); }
.scroll { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
.muted { color: var(--dim); }
.tag { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--dim); border: 1px solid var(--ghost);
  border-radius: 5px; padding: 1px 5px; margin-left: 6px; vertical-align: 1px; }
.pill { display: inline-block; font-family: var(--mono); font-size: 12px; background: var(--chip); border: 1px solid var(--hair);
  border-radius: 7px; padding: 3px 7px; margin: 2px 3px 2px 0; color: var(--sub); }

.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hair); font-size: 14px; min-width: 0; }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .r { font-variant-numeric: tabular-nums; color: var(--sub); white-space: nowrap; }
.hbar { flex: 1; height: 8px; background: var(--slot); border-radius: 4px; overflow: hidden; min-width: 40px; }
.hbar i { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.stack { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; min-width: 60px; flex: 1; }
.stack i { display: block; height: 100%; }

.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-family: var(--mono); font-size: 10.5px; fill: var(--dim); }
details.tbl { margin-top: 10px; }
details.tbl summary { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); cursor: pointer; }
details.tbl summary:hover { color: var(--sub); }
details.tbl .scroll { max-height: 280px; overflow: auto; margin-top: 8px; }
details.tbl table { font-size: 12.5px; }

.heat { display: grid; gap: 2px; font-family: var(--mono); font-size: 10px; color: var(--dim); }
.heat .c { height: 22px; border-radius: 4px; background: var(--slot); }
.heat .c:hover { outline: 1px solid var(--ink); }
.scale { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10px; color: var(--dim); margin-top: 10px; }
.scale i { width: 120px; height: 8px; border-radius: 4px; display: block; }

.map { height: 460px; border-radius: 14px; overflow: hidden; background: #101317; }
.leaflet-container { background: #101317; font-family: var(--grotesk); }
.leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.72) contrast(.9) saturate(.35); }
.leaflet-tooltip { background: var(--chip); color: var(--ink); border: 1px solid var(--hair); border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,.5); font-size: 13px; padding: 6px 9px; }
.leaflet-tooltip::before { display: none; }
.leaflet-control-attribution { background: rgba(11,12,14,.7) !important; color: var(--faint) !important; font-size: 10px; }
.leaflet-control-attribution a { color: var(--dim) !important; }
.leaflet-bar a { background: var(--chip) !important; color: var(--ink) !important; border-color: var(--hair) !important; }

#tip { position: fixed; z-index: 2000; pointer-events: none; background: var(--chip); border: 1px solid var(--hair);
  border-radius: 12px; padding: 9px 11px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.55); display: none; max-width: 280px; }
#tip .t { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-bottom: 5px; }
#tip .v { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
#tip .v b { font-weight: 600; font-variant-numeric: tabular-nums; }
#tip .v span { color: var(--sub); }
#tip .v .line { width: 12px; height: 2px; border-radius: 1px; }

.empty { color: var(--dim); font-size: 14px; padding: 18px 0; text-align: center; }
.callout { background: var(--slot); border-radius: 14px; padding: 14px 16px; font-size: 15px; line-height: 1.45; margin-bottom: 14px; }
.callout b { font-weight: 600; }
.meter { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; margin-top: 10px; }
.meter i { display: block; height: 100%; background: var(--sub); }
input.search { background: var(--slot); border: 1px solid var(--hair); color: var(--ink); border-radius: 10px; padding: 9px 12px;
  font: 14px var(--mono); width: 100%; max-width: 240px; }
details.more summary { cursor: pointer; color: var(--sub); font-size: 14px; padding: 8px 0; }

.gate { max-width: 380px; margin: 18vh auto 0; padding: 0 16px; text-align: center; }
.gate input { width: 100%; margin: 18px 0 12px; background: var(--card); border: 1px solid var(--hair); color: var(--ink);
  border-radius: 12px; padding: 14px; font: 15px var(--mono); }
.gate button { width: 100%; background: var(--yellow); color: var(--bg); border: 0; border-radius: 14px; padding: 15px;
  font: 600 13px var(--mono); letter-spacing: .2em; text-transform: uppercase; cursor: pointer; }
.gate p { color: var(--sub); line-height: 1.5; }
.loading { opacity: .5; transition: opacity .2s; }
footer { margin-top: 56px; color: var(--faint); font-size: 12.5px; line-height: 1.6; }
</style>
</head>
<body>
<div id="app"></div>
<div id="tip" role="tooltip"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';

// MARK: - Constants

// Stacking order keeps brass and grey apart: that's the order that passes the
// colour-blindness checks against the dark card.
const TIERS = [
  { id: 'LEGENDARY', label: 'Legendary', color: '#E4002B' },
  { id: 'GOLD', label: 'Gold', color: '#FFCE00' },
  { id: 'RARE', label: 'Rare', color: '#23E5A0' },
  { id: 'VINTAGE', label: 'Vintage', color: '#D2A064' },
  { id: 'ON TEST', label: 'On test', color: '#B79BFF' },
  { id: 'COMMON', label: 'Common', color: '#8A8F98' },
];
const TIER = Object.fromEntries(TIERS.map((t, i) => [t.id, { ...t, rank: i }]));
TIER.UNKNOWN = { id: 'UNKNOWN', label: 'Unknown', color: '#5CC8FF', rank: 9 };
const RARE_TIERS = ['LEGENDARY', 'VINTAGE', 'ON TEST'];
const KIND = { 1: 'Bus', 2: 'Tram' };
const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const WEEKDAYS_LONG = ['Sundays', 'Mondays', 'Tuesdays', 'Wednesdays', 'Thursdays', 'Fridays', 'Saturdays'];
const MON_FIRST = [1, 2, 3, 4, 5, 6, 0];
const SAMPLE_MIN = 5;
const DB_LIMIT = 500 * 1024 * 1024;
const RANGES = [[7, '7 days'], [30, '30 days'], [90, '90 days'], [0, 'All time']];

// MARK: - Small helpers

// Builds DOM. Strings become text nodes, so feed data can never inject markup.
function h(tag, props, ...kids) {
  const el = tag.includes(':') ? document.createElementNS('http://www.w3.org/2000/svg', tag.split(':')[1]) : document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.setAttribute('class', v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const s = (tag, props, ...kids) => h('svg:' + tag, props, ...kids);
const fmt = (n, d = 0) => n == null || !isFinite(n) ? '–' : n.toLocaleString('en-GB', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (n, d = 0) => n == null || !isFinite(n) ? '–' : fmt(n * 100, d) + '%';
const hhmm = (m) => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const hours = (samples) => samples * SAMPLE_MIN / 60;
const dur = (min) => min >= 60 ? `${Math.floor(min / 60)} h ${String(Math.round(min % 60)).padStart(2, '0')} m` : `${Math.round(min)} m`;
const weekday = (day) => new Date(day + 'T00:00:00Z').getUTCDay();
const shortDay = (day) => new Date(day + 'T00:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
const longDay = (day) => new Date(day + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
const dot = (color) => h('span', { class: 'dot', style: { background: color } });
const tierDot = (tier) => dot((TIER[tier] || TIER.UNKNOWN).color);
const lineSort = (a, b) => (parseInt(a) || 9999) - (parseInt(b) || 9999) || String(a).localeCompare(String(b));
const sum = (a) => a.reduce((x, y) => x + y, 0);
const by = (f, desc) => (a, b) => (desc ? f(b) - f(a) : f(a) - f(b));
// Counts get whole-number steps: a tick at 2.5 vehicles would round to a wrong label.
function niceStep(max, whole = false, ticks = 4) {
  if (!(max > 0)) return 1;
  const raw = max / ticks, mag = 10 ** Math.floor(Math.log10(raw)), n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 && !whole ? 2.5 : n <= 5 ? 5 : 10) * mag;
  return whole ? Math.max(1, Math.round(step)) : step;
}

// One tooltip for the page. Values lead, labels follow.
const tip = {
  el: document.getElementById('tip'),
  show(ev, title, rows) {
    this.el.replaceChildren(
      title ? h('div', { class: 't' }, title) : null,
      ...rows.map(([color, value, label, mark = 'line']) => h('div', { class: 'v' },
        color ? h('i', { class: mark === 'line' ? 'line' : 'dot', style: { background: color, display: 'inline-block' } }) : null,
        h('b', {}, value), label ? h('span', {}, label) : null)));
    this.el.style.display = 'block';
    const w = this.el.offsetWidth, hgt = this.el.offsetHeight;
    let x = ev.clientX + 14, y = ev.clientY + 14;
    if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
    if (y + hgt > innerHeight - 8) y = ev.clientY - hgt - 14;
    this.el.style.left = Math.max(8, x) + 'px';
    this.el.style.top = Math.max(8, y) + 'px';
  },
  hide() { this.el.style.display = 'none'; },
};

// Every chart is a table too.
function tableView(head, rows) {
  return h('details', { class: 'tbl' }, h('summary', {}, 'Show as table'),
    h('div', { class: 'scroll' }, h('table', {},
      h('thead', {}, h('tr', {}, head.map((c, i) => h('th', { class: i ? 'r' : '' }, c)))),
      h('tbody', {}, rows.map((r) => h('tr', {}, r.map((c, i) => h('td', { class: i ? 'r' : '' }, c))))))));
}

// MARK: - Charts

// Charts redraw on resize, so they're kept as functions of their box.
const charts = [];
function mount(box, draw) {
  const run = () => { box.replaceChildren(); draw(box, Math.max(260, box.clientWidth)); };
  charts.push({ box, run });
  requestAnimationFrame(run);
  return box;
}
let resizeTimer;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => charts.filter((c) => c.box.isConnected).forEach((c) => c.run()), 150);
});

// Lines on one axis, with a crosshair that snaps to the nearest x.
function lineChart({ series, xMin, xMax, xTicks, xLabel, yFmt = (v) => fmt(v), yMax, height = 220, table, whole = false }) {
  const box = h('div', { class: 'chart' });
  mount(box, (box, W) => {
    const P = { l: 44, r: 16, t: 12, b: 26 };
    const all = series.flatMap((se) => se.pts.map((p) => p[1]));
    const top = yMax ?? Math.max(1, ...all);
    const step = yMax === 1 ? 0.25 : niceStep(top, whole);
    const yTop = yMax ?? Math.ceil(top / step) * step;
    const X = (x) => P.l + (x - xMin) / Math.max(1e-9, xMax - xMin) * (W - P.l - P.r);
    const Y = (y) => P.t + (1 - y / yTop) * (height - P.t - P.b);
    const svg = s('svg', { viewBox: `0 0 ${W} ${height}`, height, role: 'img' });
    for (let v = 0; v <= yTop + 1e-9; v += step) {
      svg.append(s('line', { x1: P.l, x2: W - P.r, y1: Y(v), y2: Y(v), stroke: v ? 'rgba(255,255,255,.06)' : 'rgba(255,255,255,.14)', 'stroke-width': 1 }));
      svg.append(s('text', { x: P.l - 8, y: Y(v) + 3.5, 'text-anchor': 'end' }, yFmt(v)));
    }
    const every = Math.ceil(xTicks.length / Math.max(2, Math.floor((W - P.l - P.r) / 56)));
    xTicks.forEach(([x, label], i) => {
      if (i % every) return;
      svg.append(s('text', { x: X(x), y: height - 6, 'text-anchor': 'middle' }, label));
    });
    for (const se of series) {
      if (!se.pts.length) continue;
      // A gap in the data is a gap in the line, not a straight bridge across it.
      let d = '', prev = null;
      for (const [x, y] of se.pts) {
        d += (prev != null && x - prev <= (se.gap ?? Infinity) ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(y).toFixed(1);
        prev = x;
      }
      svg.append(s('path', { d, fill: 'none', stroke: se.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', opacity: se.muted ? 0.9 : 1 }));
      if (se.pts.length === 1 || se.endDot) {
        const [x, y] = se.pts.at(-1);
        svg.append(s('circle', { cx: X(x), cy: Y(y), r: 4, fill: se.color, stroke: 'var(--card)', 'stroke-width': 2 }));
      }
    }
    const cross = s('line', { y1: P.t, y2: height - P.b, stroke: 'rgba(255,255,255,.3)', 'stroke-width': 1, visibility: 'hidden' });
    const marks = series.map((se) => s('circle', { r: 4, fill: se.color, stroke: 'var(--card)', 'stroke-width': 2, visibility: 'hidden' }));
    svg.append(cross, ...marks);
    const xs = [...new Set(series.flatMap((se) => se.pts.map((p) => p[0])))].sort((a, b) => a - b);
    const hit = s('rect', { x: P.l, y: 0, width: W - P.l - P.r, height, fill: 'transparent' });
    hit.addEventListener('pointermove', (ev) => {
      if (!xs.length) return;
      const rect = svg.getBoundingClientRect();
      const px = (ev.clientX - rect.left) * (W / rect.width);
      const x = xs.reduce((a, b) => Math.abs(X(b) - px) < Math.abs(X(a) - px) ? b : a);
      cross.setAttribute('x1', X(x)); cross.setAttribute('x2', X(x)); cross.setAttribute('visibility', 'visible');
      const rows = [];
      series.forEach((se, i) => {
        const p = se.pts.find((q) => q[0] === x);
        if (!p) { marks[i].setAttribute('visibility', 'hidden'); return; }
        marks[i].setAttribute('cx', X(x)); marks[i].setAttribute('cy', Y(p[1])); marks[i].setAttribute('visibility', 'visible');
        rows.push([se.color, (se.fmt ?? yFmt)(p[1]), se.name + (p[2] ? ' · ' + p[2] : '')]);
      });
      tip.show(ev, xLabel(x), rows);
    });
    hit.addEventListener('pointerleave', () => { tip.hide(); cross.setAttribute('visibility', 'hidden'); marks.forEach((m) => m.setAttribute('visibility', 'hidden')); });
    svg.append(hit);
    box.append(svg);
  });
  const legend = series.length > 1 ? h('div', { class: 'legend' }, series.map((se) =>
    h('span', { class: 'key' }, h('i', { class: 'line', style: { background: se.color } }), se.name))) : null;
  return h('div', {}, legend, box, table ?? null);
}

// Columns from one baseline, each its own hover target.
function columns({ bars, color, yFmt = (v) => fmt(v), height = 200, table, avg }) {
  const box = h('div', { class: 'chart' });
  mount(box, (box, W) => {
    const P = { l: 36, r: 8, t: 14, b: 26 };
    const top = Math.max(1, ...bars.map((b) => b.value));
    const step = niceStep(top, true), yTop = Math.ceil(top / step) * step;
    const band = (W - P.l - P.r) / Math.max(1, bars.length);
    const bw = Math.max(2, Math.min(24, band - 2));
    const Y = (y) => P.t + (1 - y / yTop) * (height - P.t - P.b);
    const svg = s('svg', { viewBox: `0 0 ${W} ${height}`, height, role: 'img' });
    for (let v = 0; v <= yTop + 1e-9; v += step) {
      svg.append(s('line', { x1: P.l, x2: W - P.r, y1: Y(v), y2: Y(v), stroke: v ? 'rgba(255,255,255,.06)' : 'rgba(255,255,255,.14)' }));
      svg.append(s('text', { x: P.l - 8, y: Y(v) + 3.5, 'text-anchor': 'end' }, yFmt(v)));
    }
    if (avg != null && avg > 0) {
      svg.append(s('line', { x1: P.l, x2: W - P.r, y1: Y(avg), y2: Y(avg), stroke: 'rgba(255,255,255,.35)', 'stroke-width': 1 }));
      svg.append(s('text', { x: W - P.r, y: Y(avg) - 5, 'text-anchor': 'end', style: 'fill: var(--sub)' }, `avg ${fmt(avg, 1)}`));
    }
    const every = Math.ceil(bars.length / Math.max(2, Math.floor((W - P.l - P.r) / 48)));
    bars.forEach((b, i) => {
      const cx = P.l + band * (i + 0.5), x = cx - bw / 2, y = Y(b.value), y0 = Y(0), r = Math.min(4, bw / 2, y0 - y);
      const d = b.value > 0
        ? `M${x} ${y0} V${y + r} Q${x} ${y} ${x + r} ${y} H${x + bw - r} Q${x + bw} ${y} ${x + bw} ${y + r} V${y0} Z` : '';
      const bar = s('path', { d, fill: b.color ?? color });
      const hit = s('rect', { x: cx - band / 2, y: P.t, width: band, height: height - P.t - P.b, fill: 'transparent' });
      hit.addEventListener('pointermove', (ev) => { bar.setAttribute('opacity', 0.8); tip.show(ev, b.title ?? b.label, [[b.color ?? color, yFmt(b.value), b.unit ?? '', 'dot']]); });
      hit.addEventListener('pointerleave', () => { bar.setAttribute('opacity', 1); tip.hide(); });
      svg.append(bar, hit);
      if (i % every === 0) svg.append(s('text', { x: cx, y: height - 6, 'text-anchor': 'middle' }, b.label));
    });
    box.append(svg);
  });
  return h('div', {}, box, table ?? null);
}

// A weekday × hour grid in one hue: brighter means more.
function heatGrid({ values, color, fmtV, unit }) {
  const max = Math.max(1e-9, ...values.flat().filter((v) => v != null));
  const grid = h('div', { class: 'heat', style: { gridTemplateColumns: '34px repeat(24, 1fr)' } });
  grid.append(h('span'));
  for (let hr = 0; hr < 24; hr++) grid.append(h('span', { style: { textAlign: 'center' } }, hr % 3 ? '' : String(hr)));
  MON_FIRST.forEach((wd) => {
    grid.append(h('span', { style: { alignSelf: 'center' } }, WEEKDAYS[wd]));
    for (let hr = 0; hr < 24; hr++) {
      const v = values[wd][hr];
      const cell = h('div', { class: 'c', tabindex: 0, style: v == null ? {} : { background: color, opacity: String(0.12 + 0.88 * Math.sqrt(v / max)) } });
      const show = (ev) => tip.show(ev, `${WEEKDAYS_LONG[wd]} ${String(hr).padStart(2, '0')}:00–${String(hr + 1).padStart(2, '0')}:00`,
        [[color, v == null ? 'no data' : fmtV(v), v == null ? '' : unit, 'dot']]);
      cell.addEventListener('pointermove', show);
      cell.addEventListener('pointerleave', () => tip.hide());
      grid.append(cell);
    }
  });
  const scale = h('div', { class: 'scale' }, h('span', {}, '0'),
    h('i', { style: { background: `linear-gradient(90deg, ${color}1f, ${color})` } }), h('span', {}, fmtV(max)));
  return h('div', {}, h('div', { class: 'scroll' }, h('div', { style: { minWidth: '480px' } }, grid)), scale);
}

function sparkline(values, color, w = 90, hgt = 22) {
  if (values.length < 2) return h('span', { class: 'muted' }, '–');
  const max = Math.max(1, ...values);
  const pts = values.map((v, i) => `${(i / (values.length - 1) * (w - 4) + 2).toFixed(1)},${(hgt - 3 - v / max * (hgt - 6)).toFixed(1)}`);
  return s('svg', { width: w, height: hgt, viewBox: `0 0 ${w} ${hgt}` },
    s('polyline', { points: pts.join(' '), fill: 'none', stroke: color, 'stroke-width': 1.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
}

// A share split by tier, rarest first, with the 2 px gaps between parts.
function tierStack(parts, title) {
  const total = sum(Object.values(parts));
  const el = h('div', { class: 'stack' }, [...TIERS, TIER.UNKNOWN].filter((t) => parts[t.id]).map((t) =>
    h('i', { style: { width: (parts[t.id] / total * 100) + '%', background: t.color, minWidth: '2px' } })));
  el.addEventListener('pointermove', (ev) => tip.show(ev, title, [...TIERS, TIER.UNKNOWN].filter((t) => parts[t.id])
    .map((t) => [t.color, pct(parts[t.id] / total, 1), t.label, 'dot'])));
  el.addEventListener('pointerleave', () => tip.hide());
  return el;
}

function hbarRow(label, value, max, color, right, onTip) {
  const row = h('div', { class: 'row' }, h('span', { style: { width: '38%', minWidth: '90px' }, class: 'grow' }, label),
    h('div', { class: 'hbar' }, h('i', { style: { width: (max ? value / max * 100 : 0) + '%', background: color } })),
    h('span', { class: 'r', style: { minWidth: '64px', textAlign: 'right' } }, right));
  if (onTip) {
    row.addEventListener('pointermove', (ev) => tip.show(ev, ...onTip()));
    row.addEventListener('pointerleave', () => tip.hide());
  }
  return row;
}

function tile(label, value, sub, cls = 's3', extra) {
  return h('div', { class: `card tile ${cls}` }, h('div', { class: 'label' }, label), h('div', { class: 'value' }, value),
    sub ? h('div', { class: 'sub' }, sub) : null, extra ?? null);
}

function card(cls, title, note, ...body) {
  return h('div', { class: 'card ' + cls }, title ? h('h3', {}, title) : null, note ? h('p', { class: 'note' }, note) : null, ...body);
}

function section(id, eyebrow, title, lede, ...body) {
  return h('section', { id }, h('div', { class: 'head' }, h('div', {},
    h('div', { class: 'mono' }, eyebrow), h('h2', {}, title), lede ? h('p', { class: 'lede' }, lede) : null)), ...body);
}

function chipRow(options, current, onPick, colorOf) {
  return h('div', { class: 'chips' }, options.map(([value, label]) =>
    h('button', { class: 'chip', 'aria-pressed': String(value === current), onclick: () => onPick(value) },
      colorOf ? dot(colorOf(value)) : null, label)));
}

function sortableTable(cols, rows, state, onRow, selected) {
  const col = cols.find((c) => c.key === state.key) ?? cols[0];
  const sorted = [...rows].sort((a, b) => {
    const x = col.sort(a), y = col.sort(b);
    return (typeof x === 'string' ? x.localeCompare(y) : x - y) * (state.desc ? -1 : 1);
  });
  return h('div', { class: 'scroll' }, h('table', {},
    h('thead', {}, h('tr', {}, cols.map((c) => h('th', {
      class: `sort ${c.right ? 'r' : ''} ${c.key === col.key ? 'on' : ''} ${c.hide ? 'hide-sm' : ''}`,
      onclick: () => { state.desc = c.key === state.key ? !state.desc : c.right ?? false; state.key = c.key; render(); },
    }, c.label + (c.key === col.key ? (state.desc ? ' ↓' : ' ↑') : ''))))),
    h('tbody', {}, sorted.map((r) => h('tr', { class: `${onRow ? 'click' : ''} ${selected?.(r) ? 'sel' : ''}`, onclick: onRow ? () => onRow(r) : null },
      cols.map((c) => h('td', { class: `${c.right ? 'r' : ''} ${c.hide ? 'hide-sm' : ''}` }, c.cell(r))))))));
}

// MARK: - Data

const state = {
  key: localStorage.getItem('taborStatsKey') ?? '',
  range: Number(localStorage.getItem('taborStatsRange') ?? 30),
  huntTier: 'LEGENDARY', mapTier: 'LEGENDARY', kindFilter: 0,
  modelSort: { key: 'util', desc: true }, model: null, modelHours: null, lineQuery: '',
  fleet: null, live: null, hist: null, error: null, loading: false,
};

async function api(path) {
  const res = await fetch(path, { headers: { Authorization: 'Bearer ' + state.key }, cache: 'no-store' });
  if (res.status === 401) { localStorage.removeItem('taborStatsKey'); state.key = ''; throw new Error('key'); }
  if (!res.ok) throw new Error(`${path}: ${res.status}`);
  return res.json();
}

async function load(parts = ['fleet', 'live', 'hist']) {
  state.loading = true;
  document.getElementById('main')?.classList.add('loading');
  try {
    const [fleet, live, hist] = await Promise.all([
      parts.includes('fleet') ? api('/api/fleet') : state.fleet,
      parts.includes('live') ? api('/api/live') : state.live,
      parts.includes('hist') ? api('/api/history?days=' + state.range) : state.hist,
    ]);
    Object.assign(state, { fleet, live, hist, error: null });
    derive();
  } catch (e) {
    state.error = e.message;
  }
  state.loading = false;
  render();
}

// Lookups the sections share.
let D = {};
function derive() {
  const models = new Map(state.fleet.models.map(([id, name, kind, tier, fleet]) => [id, { id, name, kind, tier, fleet }]));
  const byNumber = new Map(state.fleet.fleet.map(([kind, number, model, year, depot]) => [kind * 1e6 + number, { kind, number, model, year, depot }]));
  const tierFleet = {};
  for (const m of models.values()) tierFleet[m.tier] = (tierFleet[m.tier] ?? 0) + m.fleet;
  const info = (kind, number) => {
    const f = byNumber.get(kind * 1e6 + number);
    const m = f && models.get(f.model);
    return { f, m, tier: m?.tier ?? 'UNKNOWN' };
  };
  const hist = state.hist;
  const validDays = hist.days.filter((d) => d[1] > 0).map((d) => d[0]);
  const thisYear = Number(state.live.today.slice(0, 4));
  D = { models, byNumber, tierFleet, info, validDays, thisYear };
}

// MARK: - Sections

function renderNow() {
  const latest = state.live.latest;
  if (!latest) return section('now', 'Right now', 'Waiting for the first snapshot', 'The collector takes one every 5 minutes.');
  const counts = {}, kinds = { 1: 0, 2: 0 }, rare = [], unknown = [];
  for (const [n, k, line, lat, lon] of latest.v) {
    const { m, tier } = D.info(k, n);
    counts[tier] = (counts[tier] ?? 0) + 1;
    kinds[k]++;
    if (RARE_TIERS.includes(tier)) rare.push({ n, k, line, m, tier });
    if (!m) unknown.push({ n, k, line });
  }
  const ageMin = Math.round((Date.now() / 1000 - latest.ts) / 60);
  const tiles = TIERS.map((t) => tile(t.label, fmt(counts[t.id] ?? 0),
    `${pct((counts[t.id] ?? 0) / (D.tierFleet[t.id] || 1))} of ${fmt(D.tierFleet[t.id] ?? 0)} on the road`, 's2',
    h('div', { class: 'bar' }, h('i', { style: { width: pct(Math.min(1, (counts[t.id] ?? 0) / (D.tierFleet[t.id] || 1))), background: t.color } }))));
  rare.sort((a, b) => TIER[a.tier].rank - TIER[b.tier].rank || a.m.name.localeCompare(b.m.name) || a.n - b.n);

  const mapBox = h('div', { class: 'map' });
  requestAnimationFrame(() => liveMap(mapBox, latest.v));

  return section('now', `Right now · ${hhmm(latest.minute)}${ageMin > 10 ? ` · ${ageMin} min ago` : ''}`, 'On the road',
    ageMin > 15 ? `The newest snapshot is ${ageMin} minutes old: the city's feed may be down.` : null,
    h('div', { class: 'grid' },
      h('div', { class: 'card tile hero s6' }, h('div', { class: 'label' }, 'Vehicles out now'),
        h('div', { class: 'value' }, fmt(latest.v.length)),
        h('div', { class: 'sub' }, `${fmt(kinds[1])} buses · ${fmt(kinds[2])} trams · ${pct(latest.v.length / (sum(Object.values(D.tierFleet)) || 1))} of everything in the book`),
        h('div', { style: { display: 'flex', marginTop: '22px' } }, tierStack(counts, 'Out now, by tier')),
        h('div', { class: 'legend', style: { marginTop: '10px' } }, [...TIERS, TIER.UNKNOWN].filter((t) => counts[t.id]).map((t) =>
          h('span', { class: 'key' }, dot(t.color), `${t.label} ${pct(counts[t.id] / latest.v.length)}`)))),
      h('div', { class: 'card s6' }, h('h3', {}, 'The rare ones out now'),
        h('p', { class: 'note' }, 'Every legendary, vintage and on-test vehicle in the newest snapshot.'),
        rare.length ? h('div', { class: 'list', style: { maxHeight: '190px', overflow: 'auto' } }, rare.map((r) =>
          h('div', { class: 'row' }, tierDot(r.tier), h('span', { class: 'grow' }, r.m.name), h('span', { class: 'r' }, `#${r.n}`),
            h('span', { class: 'pill' }, r.line || '–'))))
          : h('div', { class: 'empty' }, 'None out right now.')),
      ...tiles,
      card('s12', 'Live map', 'Every vehicle in the newest snapshot, coloured by tier. Hover one for its model and line.',
        h('div', { class: 'legend' }, [...TIERS, TIER.UNKNOWN].filter((t) => counts[t.id]).map((t) =>
          h('span', { class: 'key' }, dot(t.color), `${t.label} ${fmt(counts[t.id])}`))), mapBox),
      unknown.length ? card('s12', `Not in the fleet data (${unknown.length})`,
        'Numbers on the live feed that fleet.json doesn\'t know: new deliveries, trials, or typos in the feed.',
        h('div', {}, unknown.sort(by((u) => u.n)).map((u) => h('span', { class: 'pill' }, `${KIND[u.k]} #${u.n}${u.line ? ' · ' + u.line : ''}`)))) : null));
}

function liveMap(box, rows) {
  if (!window.L || !box.isConnected) return;
  const map = L.map(box, { preferCanvas: true, scrollWheelZoom: false }).setView([52.2297, 21.0122], 11);
  tiles(map);
  // Common ones first, so the rare ones draw on top.
  const sorted = rows.map(([n, k, line, lat, lon]) => ({ n, k, line, lat, lon, ...D.info(k, n) }))
    .sort((a, b) => (TIER[b.tier] ?? TIER.UNKNOWN).rank - (TIER[a.tier] ?? TIER.UNKNOWN).rank);
  for (const v of sorted) {
    const t = TIER[v.tier] ?? TIER.UNKNOWN;
    const common = v.tier === 'COMMON';
    L.circleMarker([v.lat / 1e4, v.lon / 1e4], {
      radius: common ? 2.5 : 5, color: '#0B0C0E', weight: common ? 0.5 : 2, fillColor: t.color, fillOpacity: common ? 0.55 : 1,
    }).bindTooltip(`${escapeText(v.m?.name ?? 'Unknown model')} · #${v.n}${v.line ? ' · line ' + escapeText(v.line) : ''}`).addTo(map);
  }
}

// Leaflet's tooltips take HTML; feed text goes through this first.
function escapeText(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

function tiles(map) {
  // OpenStreetMap's own tiles need no key; the tile pane's CSS filter turns them dark.
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map);
}

function renderToday() {
  const live = state.live;
  const rows = live.vehicles.map(([k, n, c, a, b, lines]) => ({ k, n, c, a, b, lines: (lines ?? '').split(',').filter(Boolean), ...D.info(k, n) }));
  if (!rows.length) return section('today', 'Today', 'Today so far', 'Nothing collected yet today.');
  const tierCount = {};
  for (const r of rows) tierCount[r.tier] = (tierCount[r.tier] ?? 0) + 1;
  const modelsSeen = new Set(rows.filter((r) => r.m).map((r) => r.m.id)).size;
  const curve = live.curve.filter((c) => c[1] === 3);
  const peak = curve.reduce((p, c) => c[2] + c[3] > (p ? p[2] + p[3] : -1) ? c : p, null);

  // "Typical" is the same weekday's average, from the history range above.
  const wd = weekday(live.today);
  const typical = [];
  const wkSamples = new Map(state.hist.weekSamples.map(([w, hr, n]) => [w * 100 + hr, n]));
  const wkOut = new Map();
  for (const [w, , , hr, vs] of state.hist.weekTier) if (w === wd) wkOut.set(hr, (wkOut.get(hr) ?? 0) + vs);
  for (let hr = 0; hr < 24; hr++) {
    const n = wkSamples.get(wd * 100 + hr);
    if (n) typical.push([hr * 60 + 30, wkOut.get(hr) / n]);
  }
  const rare = rows.filter((r) => RARE_TIERS.includes(r.tier)).sort((a, b) => TIER[a.tier].rank - TIER[b.tier].rank || b.c - a.c);
  const gold = rows.filter((r) => r.tier === 'GOLD');
  const ticks = Array.from({ length: 9 }, (_, i) => [i * 180, hhmm(i * 180)]);

  return section('today', `Today · ${longDay(live.today)}`, 'Today so far',
    `${fmt(live.good)} snapshots so far${live.samples - live.good ? `, ${live.samples - live.good} with part of the feed missing` : ''}.`,
    h('div', { class: 'grid' },
      tile('Different vehicles out', fmt(rows.length), `${fmt(rows.filter((r) => r.k === 1).length)} buses · ${fmt(rows.filter((r) => r.k === 2).length)} trams`),
      tile('Legendaries out today', fmt(tierCount.LEGENDARY ?? 0), `of ${fmt(D.tierFleet.LEGENDARY)} in the fleet`, 's3',
        h('div', { class: 'bar' }, h('i', { style: { width: pct((tierCount.LEGENDARY ?? 0) / (D.tierFleet.LEGENDARY || 1)), background: TIER.LEGENDARY.color } }))),
      tile('Gold out today', fmt(gold.length), `of ${fmt(D.tierFleet.GOLD)} in the fleet`, 's3',
        h('div', { class: 'bar' }, h('i', { style: { width: pct(gold.length / (D.tierFleet.GOLD || 1)), background: TIER.GOLD.color } }))),
      tile('Busiest moment', peak ? fmt(peak[2] + peak[3]) : '–', peak ? `out at once, at ${hhmm(peak[0])} · ${modelsSeen} of ${D.models.size} models seen today` : ''),
      card('s12', 'Vehicles out through the day',
        typical.length ? `Every 5 minutes, against an average ${WEEKDAYS_LONG[wd].slice(0, -1)} (hourly, from the selected range).`
          : `Every 5 minutes. An average ${WEEKDAYS_LONG[wd].slice(0, -1)} joins it once one has been rolled up.`,
        lineChart({
          series: [
            { name: 'Today', color: '#FFCE00', gap: 15, endDot: true, pts: curve.map((c) => [c[0], c[2] + c[3], `${fmt(c[2])} buses, ${fmt(c[3])} trams`]) },
            ...(typical.length ? [{ name: `Average ${WEEKDAYS[wd]}`, color: '#8A8F98', muted: true, pts: typical, fmt: (v) => fmt(v) }] : []),
          ],
          xMin: 0, xMax: 1440, xTicks: ticks, xLabel: (x) => hhmm(x), height: 240, whole: true,
          table: tableView(['Time', 'Buses', 'Trams', 'Total'], curve.map((c) => [hhmm(c[0]), fmt(c[2]), fmt(c[3]), fmt(c[2] + c[3])])),
        })),
      card('s12', `The rare ones today (${rare.length})`, 'Every legendary, vintage and on-test vehicle seen today, and for how long.',
        rare.length ? h('div', { class: 'scroll' }, h('table', {},
          h('thead', {}, h('tr', {}, h('th', {}, 'Model'), h('th', { class: 'r' }, 'Number'), h('th', {}, 'Lines'), h('th', { class: 'r' }, 'First–last'), h('th', { class: 'r' }, 'Time out'))),
          h('tbody', {}, rare.map((r) => h('tr', {},
            h('td', {}, h('span', { class: 'key' }, tierDot(r.tier), r.m.name)), h('td', { class: 'r' }, `#${r.n}`),
            h('td', {}, r.lines.sort(lineSort).map((l) => h('span', { class: 'pill' }, l))),
            h('td', { class: 'r' }, `${hhmm(r.a)}–${hhmm(r.b)}`), h('td', { class: 'r' }, dur(r.c * SAMPLE_MIN)))))))
          : h('div', { class: 'empty' }, 'None yet today.'))));
}

function noHistory(id, eyebrow, title) {
  return section(id, eyebrow, title, null, h('div', { class: 'card' }, h('div', { class: 'empty' },
    'History starts after the first nightly rollup (about 03:30 Warsaw time). Until then, "Right now" and "Today" are live.')));
}

function renderRarity() {
  const days = D.validDays;
  if (!days.length) return noHistory('rarity', 'Rarity over time', 'How much of each tier runs');
  const perDay = new Map(days.map((d) => [d, {}]));
  for (const [day, , tier, vehicles] of state.hist.tierDay) {
    const t = perDay.get(day);
    if (t) t[tier] = (t[tier] ?? 0) + vehicles;
  }
  const avgOf = (tier, filter = () => true) => {
    const ds = days.filter(filter);
    return ds.length ? sum(ds.map((d) => perDay.get(d)[tier] ?? 0)) / ds.length : null;
  };
  const isWeekend = (d) => [0, 6].includes(weekday(d));
  const legendDays = days.map((d) => [d, perDay.get(d).LEGENDARY ?? 0]);
  const best = legendDays.reduce((a, b) => b[1] > a[1] ? b : a);
  const totals = days.map((d) => sum(Object.values(perDay.get(d))));
  const xTicks = days.map((d, i) => [i, shortDay(d)]);

  return section('rarity', `Rarity over time · ${days.length} day${days.length > 1 ? 's' : ''}`, 'How much of each tier runs',
    'A vehicle counts for a day if it shows up in at least one snapshot that day.',
    h('div', { class: 'grid' },
      tile('Legendaries a day', fmt(avgOf('LEGENDARY'), 1),
        `on average, of ${D.tierFleet.LEGENDARY} · weekdays ${fmt(avgOf('LEGENDARY', (d) => !isWeekend(d)), 1)}, weekends ${fmt(avgOf('LEGENDARY', isWeekend), 1)}`),
      tile('Gold a day', fmt(avgOf('GOLD'), 1), `on average, of ${fmt(D.tierFleet.GOLD)}`),
      tile('Rare a day', fmt(avgOf('RARE'), 1), `on average, of ${fmt(D.tierFleet.RARE)}`),
      tile('Vehicles a day', fmt(sum(totals) / totals.length), `on average · best legendary day: ${best[1]} on ${shortDay(best[0])}`),
      card('s6', 'Legendaries out each day', 'Different legendary vehicles seen, per day.',
        columns({
          bars: legendDays.map(([d, v]) => ({ label: shortDay(d), title: longDay(d), value: v, unit: 'legendaries' })),
          color: TIER.LEGENDARY.color, avg: avgOf('LEGENDARY'),
          table: tableView(['Day', 'Legendaries'], legendDays.map(([d, v]) => [longDay(d), fmt(v)])),
        })),
      card('s6', 'Share of each tier on the road', 'Vehicles seen that day, as a share of the tier\'s whole fleet.',
        lineChart({
          series: TIERS.map((t) => ({ name: t.label, color: t.color, endDot: true,
            pts: days.map((d, i) => [i, (perDay.get(d)[t.id] ?? 0) / (D.tierFleet[t.id] || 1)]) })),
          xMin: 0, xMax: Math.max(1, days.length - 1), xTicks, xLabel: (i) => longDay(days[i]), yFmt: (v) => pct(v), yMax: 1,
          table: tableView(['Day', ...TIERS.map((t) => t.label)], days.map((d) => [longDay(d), ...TIERS.map((t) => pct((perDay.get(d)[t.id] ?? 0) / (D.tierFleet[t.id] || 1)))])),
        }))));
}

function renderHunt() {
  if (!D.validDays.length) return noHistory('hunt', 'When to hunt', 'The best hours');
  const tier = state.huntTier;
  const color = tier === 'ALL' ? '#FFCE00' : TIER[tier].color;
  const out = Array.from({ length: 7 }, () => Array(24).fill(0));
  const samples = Array.from({ length: 7 }, () => Array(24).fill(0));
  for (const [wd, , t, hr, vs] of state.hist.weekTier) if (tier === 'ALL' || t === tier) out[wd][hr] += vs;
  for (const [wd, hr, n] of state.hist.weekSamples) samples[wd][hr] = n;
  const avg = out.map((row, wd) => row.map((v, hr) => samples[wd][hr] ? v / samples[wd][hr] : null));
  let bestCell = null;
  avg.forEach((row, wd) => row.forEach((v, hr) => { if (v != null && (!bestCell || v > bestCell[2])) bestCell = [wd, hr, v]; }));
  const label = tier === 'ALL' ? 'vehicles' : `${TIER[tier].label.toLowerCase()} vehicles`;
  const curveFor = (wds) => Array.from({ length: 24 }, (_, hr) => {
    const n = sum(wds.map((wd) => samples[wd][hr]));
    return n ? [hr, sum(wds.map((wd) => out[wd][hr])) / n] : null;
  }).filter(Boolean);
  const weekdays = curveFor([1, 2, 3, 4, 5]), weekends = curveFor([0, 6]);
  const d1 = (v) => fmt(v, v < 10 ? 1 : 0);

  return section('hunt', 'When to hunt', 'The best hours',
    'How many are out at once, on average, for each weekday and hour. Brighter means more.',
    chipRow([['LEGENDARY', 'Legendary'], ['GOLD', 'Gold'], ['RARE', 'Rare'], ['VINTAGE', 'Vintage'], ['ON TEST', 'On test'], ['COMMON', 'Common'], ['ALL', 'Everything']],
      tier, (v) => { state.huntTier = v; render(); }, (v) => v === 'ALL' ? '#FFCE00' : TIER[v].color),
    h('div', { class: 'grid', style: { marginTop: '12px' } },
      card('s12', null, null,
        bestCell && bestCell[2] > 0 ? h('div', { class: 'callout' }, 'Best time: ', h('b', {}, `${WEEKDAYS_LONG[bestCell[0]]}, ${String(bestCell[1]).padStart(2, '0')}:00–${String(bestCell[1] + 1).padStart(2, '0')}:00`),
          `, with ${d1(bestCell[2])} ${label} out at once on average.`) : h('div', { class: 'callout' }, `No ${label} seen in this range.`),
        heatGrid({ values: avg, color, fmtV: d1, unit: `${label} out on average` })),
      card('s12', 'Through the day', 'Average out at once, by hour: weekdays against weekends.',
        lineChart({
          series: [{ name: 'Mon–Fri', color, pts: weekdays, endDot: true }, { name: 'Sat–Sun', color: '#8A8F98', pts: weekends, endDot: true }],
          xMin: 0, xMax: 23, xTicks: Array.from({ length: 8 }, (_, i) => [i * 3, `${i * 3}:00`]), xLabel: (hr) => `${hr}:00–${hr + 1}:00`, yFmt: d1,
          table: tableView(['Hour', 'Mon–Fri', 'Sat–Sun'], Array.from({ length: 24 }, (_, hr) => [`${hr}:00`,
            d1(weekdays.find((p) => p[0] === hr)?.[1]), d1(weekends.find((p) => p[0] === hr)?.[1])])),
        }))));
}

function renderModels() {
  const days = D.validDays;
  if (!days.length) return noHistory('models', 'Models', 'Every model, ranked');
  const nDays = days.length;
  const dayIndex = new Map(days.map((d, i) => [d, i]));
  const agg = new Map([...D.models.values()].map((m) => [m.id, { m, vehicleDays: 0, vs: 0, daily: Array(nDays).fill(0), seen: 0, lines: [] }]));
  for (const [day, model, vehicles, vs] of state.hist.modelDay) {
    const a = agg.get(model);
    if (!a || !dayIndex.has(day)) continue;
    a.vehicleDays += vehicles; a.vs += vs; a.daily[dayIndex.get(day)] = vehicles;
  }
  for (const v of state.hist.vehicles) if (v[2] && agg.has(v[2])) agg.get(v[2]).seen++;
  for (const [line, model, , vs] of state.hist.lines) agg.get(model)?.lines.push([line, vs]);
  for (const a of agg.values()) {
    a.lines.sort((x, y) => y[1] - x[1]);
    Object.assign(a, { avgOut: a.vehicleDays / nDays, util: a.vehicleDays / nDays / a.m.fleet, hrs: a.vehicleDays ? hours(a.vs) / a.vehicleDays : 0 });
  }
  const rows = [...agg.values()].filter((a) => !state.kindFilter || a.m.kind === state.kindFilter);
  const cols = [
    { key: 'name', label: 'Model', sort: (r) => r.m.name, cell: (r) => h('span', { class: 'key' }, tierDot(r.m.tier), r.m.name, h('span', { class: 'tag' }, KIND[r.m.kind].toUpperCase())) },
    { key: 'tier', label: 'Tier', hide: true, sort: (r) => TIER[r.m.tier].rank, cell: (r) => TIER[r.m.tier].label },
    { key: 'fleet', label: 'Fleet', right: true, sort: (r) => r.m.fleet, cell: (r) => fmt(r.m.fleet) },
    { key: 'seen', label: 'Seen', right: true, sort: (r) => r.seen / r.m.fleet, cell: (r) => `${fmt(r.seen)} (${pct(r.seen / r.m.fleet)})` },
    { key: 'avg', label: 'Out a day', right: true, sort: (r) => r.avgOut, cell: (r) => fmt(r.avgOut, 1) },
    { key: 'util', label: 'On the road', right: true, sort: (r) => r.util, cell: (r) => pct(r.util) },
    { key: 'hrs', label: 'Hours each', right: true, hide: true, sort: (r) => r.hrs, cell: (r) => r.hrs ? fmt(r.hrs, 1) : '–' },
    { key: 'lines', label: 'Top lines', sort: (r) => r.lines.length, cell: (r) => r.lines.slice(0, 3).map(([l]) => h('span', { class: 'pill' }, l)) },
    { key: 'trend', label: 'Each day', hide: true, sort: (r) => r.avgOut, cell: (r) => sparkline(r.daily, TIER[r.m.tier].color) },
  ];
  const pick = (r) => { state.model = state.model === r.m.id ? null : r.m.id; state.modelHours = null; render(); if (state.model) loadModel(); };
  return section('models', `Models · ${nDays} day${nDays > 1 ? 's' : ''}`, 'Every model, ranked',
    '"Out a day" is how many different vehicles of the model ran each day, on average; "On the road" is that as a share of the fleet; "Hours each" is how long one ran, on a day it ran. Tap a model for its page.',
    chipRow([[0, 'All'], [1, 'Buses'], [2, 'Trams']], state.kindFilter, (v) => { state.kindFilter = v; render(); }),
    h('div', { class: 'grid', style: { marginTop: '12px' } },
      card('s12', null, null, sortableTable(cols, rows, state.modelSort, pick, (r) => r.m.id === state.model)),
      state.model ? modelPage(agg.get(state.model)) : null));
}

async function loadModel() {
  try {
    const { hours } = await api(`/api/model?id=${encodeURIComponent(state.model)}&days=${state.range}`);
    state.modelHours = hours;
    render();
  } catch (e) { /* the page still shows what it has */ }
}

function modelPage(a) {
  const m = a.m, color = TIER[m.tier].color;
  const vehicles = state.hist.vehicles.filter((v) => v[2] === m.id);
  const seen = new Set(vehicles.map((v) => v[1]));
  const numbers = state.fleet.fleet.filter((f) => f[2] === m.id).map((f) => f[1]).sort((x, y) => x - y);
  const never = numbers.filter((n) => !seen.has(n));
  const byDays = vehicles.map((v) => ({ n: v[1], days: v[4], vs: v[5] })).sort(by((v) => v.vs, true));
  const lineTotal = sum(a.lines.map((l) => l[1]));
  let week = null;
  if (state.modelHours) {
    const samples = Array.from({ length: 7 }, () => Array(24).fill(0));
    for (const [wd, hr, n] of state.hist.weekSamples) samples[wd][hr] = n;
    const out = Array.from({ length: 7 }, () => Array(24).fill(0));
    for (const [wd, hr, vs] of state.modelHours) out[wd][hr] = vs;
    week = out.map((row, wd) => row.map((v, hr) => samples[wd][hr] ? v / samples[wd][hr] : null));
  }
  return card('s12', null, null,
    h('div', { class: 'mono' }, `${TIER[m.tier].label} · ${KIND[m.kind]} · ${fmt(m.fleet)} in the fleet`),
    h('h2', { style: { margin: '6px 0 14px', fontSize: '24px' } }, m.name),
    h('div', { class: 'grid' },
      tile('Out a day', fmt(a.avgOut, 1), `on average · ${pct(a.util)} of the fleet`, 's3'),
      tile('Seen', `${fmt(seen.size)} / ${fmt(m.fleet)}`, `different vehicles in this range`, 's3'),
      tile('Hours each', a.hrs ? fmt(a.hrs, 1) : '–', 'on the road, on a day it ran', 's3'),
      tile('Lines', fmt(a.lines.length), a.lines[0] ? `mostly ${a.lines[0][0]}` : 'none seen', 's3'),
      card('s6', 'When it runs', 'Average out at once, by weekday and hour.',
        week ? heatGrid({ values: week, color, fmtV: (v) => fmt(v, 1), unit: 'out on average' }) : h('div', { class: 'empty' }, 'Loading…')),
      card('s6', 'Where it runs', 'Share of its time on the road, by line.',
        a.lines.length ? h('div', { class: 'list', style: { maxHeight: '260px', overflow: 'auto' } }, a.lines.slice(0, 25).map(([l, vs]) =>
          hbarRow(`Line ${l}`, vs, a.lines[0][1], color, pct(vs / lineTotal, 1)))) : h('div', { class: 'empty' }, 'No lines seen.')),
      card('s12', 'Its vehicles', 'Each number seen, with how many days it ran. Brighter ran more.',
        h('div', {}, byDays.map((v) => h('span', { class: 'pill', style: { borderColor: color, opacity: String(0.45 + 0.55 * v.days / Math.max(1, byDays[0]?.days ?? 1)) } },
          `#${v.n} · ${v.days} d`))),
        never.length ? h('details', { class: 'more' }, h('summary', {}, `${never.length} never seen in this range`),
          h('div', {}, never.map((n) => h('span', { class: 'pill' }, `#${n}`)))) : null)));
}

function renderLines() {
  const days = D.validDays;
  if (!days.length) return noHistory('lines', 'Lines', 'Where the rare ones run');
  const lines = new Map();
  for (const [line, model, vehicleDays, vs] of state.hist.lines) {
    const m = D.models.get(model);
    if (!m) continue;
    const l = lines.get(line) ?? { line, vs: 0, tiers: {}, models: new Map(), kind: m.kind };
    l.vs += vs;
    l.tiers[m.tier] = (l.tiers[m.tier] ?? 0) + vs;
    l.models.set(model, (l.models.get(model) ?? 0) + vs);
    lines.set(line, l);
  }
  const all = [...lines.values()];
  const rareShare = (l) => ((l.tiers.LEGENDARY ?? 0) + (l.tiers.VINTAGE ?? 0) + (l.tiers['ON TEST'] ?? 0)) / l.vs;
  const bestRare = all.filter((l) => l.vs > 50).sort(by((l) => (l.tiers.LEGENDARY ?? 0) + (l.tiers.VINTAGE ?? 0) + (l.tiers['ON TEST'] ?? 0), true)).slice(0, 12)
    .filter((l) => rareShare(l) > 0);
  const bestGold = all.filter((l) => l.vs > 50 && l.tiers.GOLD).sort(by((l) => l.tiers.GOLD / l.vs, true)).slice(0, 12);
  const varied = [...all].sort(by((l) => l.models.size, true)).slice(0, 12);
  const busiest = [...all].sort(by((l) => l.vs, true)).slice(0, 12);
  const lineRow = (l, right) => h('div', { class: 'row' }, h('span', { class: 'pill', style: { minWidth: '46px', textAlign: 'center' } }, l.line),
    tierStack(l.tiers, `Line ${l.line}: share of time by tier`), h('span', { class: 'r', style: { minWidth: '72px', textAlign: 'right' } }, right));
  const legend = h('div', { class: 'legend' }, TIERS.map((t) => h('span', { class: 'key' }, dot(t.color), t.label)));
  const q = state.lineQuery.trim().toUpperCase();
  const found = q ? lines.get(q) ?? [...lines.values()].find((l) => l.line.toUpperCase() === q) : null;
  const input = h('input', { class: 'search', placeholder: 'Look up a line: 106, N02…', value: state.lineQuery,
    oninput: (e) => { state.lineQuery = e.target.value; clearTimeout(input._t); input._t = setTimeout(() => { render(); document.querySelector('input.search')?.focus(); }, 350); } });

  return section('lines', `Lines · ${days.length} day${days.length > 1 ? 's' : ''}`, 'Where the rare ones run',
    'Each bar splits a line\'s time on the road by tier, rarest first. Only lines with a few hours of running count.',
    h('div', { class: 'grid' },
      card('s6', 'Best lines for a legendary', 'Most time with a legendary, vintage or on-test vehicle on them.',
        legend, bestRare.length ? h('div', { class: 'list' }, bestRare.map((l) => lineRow(l, `${pct(rareShare(l), 1)} rare`))) : h('div', { class: 'empty' }, 'None yet.')),
      card('s6', 'Best lines for gold', 'Highest share of time with a gold vehicle.',
        legend.cloneNode(true), bestGold.length ? h('div', { class: 'list' }, bestGold.map((l) => lineRow(l, `${pct(l.tiers.GOLD / l.vs)} gold`))) : h('div', { class: 'empty' }, 'None yet.')),
      card('s6', 'Most varied lines', 'Lines that see the most different models.',
        h('div', { class: 'list' }, varied.map((l) => lineRow(l, `${l.models.size} models`)))),
      card('s6', 'Busiest lines', 'Most vehicle-hours on the road a day.',
        h('div', { class: 'list' }, busiest.map((l) => lineRow(l, `${fmt(hours(l.vs) / days.length)} h/day`)))),
      card('s12', 'Line lookup', 'Which models run on a line, and how often.', input,
        q ? (found ? h('div', { class: 'list', style: { marginTop: '12px' } }, [...found.models].sort((a, b) => b[1] - a[1]).map(([id, vs]) => {
          const m = D.models.get(id);
          return hbarRow(h('span', { class: 'key' }, tierDot(m.tier), m.name), vs, Math.max(...found.models.values()), TIER[m.tier].color, pct(vs / found.vs, 1));
        })) : h('div', { class: 'empty' }, `No line "${state.lineQuery}" in this range.`)) : null)));
}

function renderWhere() {
  const days = D.validDays;
  if (!days.length) return noHistory('where', 'Where', 'The map');
  const tier = state.mapTier;
  const cells = state.hist.cells.filter((c) => tier === 'ALL' || c[0] === tier);
  const merged = new Map();
  for (const [, lat, lon, vs] of cells) merged.set(lat * 1e5 + lon, [lat, lon, (merged.get(lat * 1e5 + lon)?.[2] ?? 0) + vs]);
  const color = tier === 'ALL' ? '#FFCE00' : TIER[tier].color;
  const box = h('div', { class: 'map' });
  requestAnimationFrame(() => heatMap(box, [...merged.values()], color, days.length));
  return section('where', `Where · ${days.length} day${days.length > 1 ? 's' : ''}`, 'The map',
    'Time spent in each square kilometre, averaged per day. Brighter means more.',
    chipRow([['LEGENDARY', 'Legendary'], ['GOLD', 'Gold'], ['RARE', 'Rare'], ['VINTAGE', 'Vintage'], ['ON TEST', 'On test'], ['COMMON', 'Common'], ['ALL', 'Everything']],
      tier, (v) => { state.mapTier = v; render(); }, (v) => v === 'ALL' ? '#FFCE00' : TIER[v].color),
    h('div', { class: 'grid', style: { marginTop: '12px' } }, card('s12', null, null, box,
      h('div', { class: 'scale' }, h('span', {}, 'less'), h('i', { style: { background: `linear-gradient(90deg, ${color}1f, ${color})` } }), h('span', {}, 'more')))));
}

function heatMap(box, cells, color, nDays) {
  if (!window.L || !box.isConnected) return;
  const map = L.map(box, { preferCanvas: true, scrollWheelZoom: false }).setView([52.2297, 21.0122], 11);
  tiles(map);
  const max = Math.max(1, ...cells.map((c) => c[2]));
  const bounds = [];
  for (const [lat, lon, vs] of cells) {
    const s0 = lat / 100, w0 = lon * 150 / 1e4;
    bounds.push([s0, w0], [s0 + 0.01, w0 + 0.015]);
    L.rectangle([[s0, w0], [s0 + 0.01, w0 + 0.015]], { stroke: false, fillColor: color, fillOpacity: 0.08 + 0.8 * Math.sqrt(vs / max) })
      .bindTooltip(`${fmt(hours(vs) / nDays, 1)} vehicle-hours a day`).addTo(map);
  }
  // The rare ones often run out of town (the L lines), so frame wherever they were.
  if (bounds.length) map.fitBounds(bounds, { padding: [20, 20], maxZoom: 12 });
}

function renderVehicles() {
  const days = D.validDays;
  if (!days.length) return noHistory('vehicles', 'Vehicles', 'Records and oddities');
  const nDays = days.length;
  const vs = state.hist.vehicles.map(([kind, number, model, tier, d, samples, span, lines, first, last]) => {
    const f = D.byNumber.get(kind * 1e6 + number);
    return { kind, number, m: model && D.models.get(model), tier: tier ?? 'UNKNOWN', days: d, samples, span,
      lines: [...new Set((lines ?? '').split(',').filter(Boolean))].sort(lineSort), first, last, year: f?.year, depot: f?.depot };
  });
  const known = vs.filter((v) => v.m);
  const name = (v) => h('span', { class: 'key' }, tierDot(v.tier), h('span', {}, v.m?.name ?? 'Unknown'), h('span', { class: 'muted' }, ` #${v.number}`));
  const list = (items, right) => h('div', { class: 'list' }, items.map((v) => h('div', { class: 'row' }, h('span', { class: 'grow' }, name(v)), h('span', { class: 'r' }, right(v)))));
  const workhorses = [...known].sort(by((v) => v.samples, true)).slice(0, 10);
  const longest = [...known].sort(by((v) => v.span, true)).slice(0, 10);
  const hoppers = [...known].sort(by((v) => v.lines.length, true)).slice(0, 10);
  const oldest = known.filter((v) => v.year && v.tier !== 'VINTAGE').sort(by((v) => v.year)).slice(0, 10);

  // Age: the whole book against what actually runs, weighted by time on the road.
  const regular = state.fleet.fleet.filter((f) => f[3] && !['VINTAGE', 'ON TEST'].includes(D.models.get(f[2])?.tier));
  const fleetAge = D.thisYear - sum(regular.map((f) => f[3])) / regular.length;
  const run = known.filter((v) => v.year && !['VINTAGE', 'ON TEST'].includes(v.tier));
  const runAge = D.thisYear - sum(run.map((v) => v.year * v.samples)) / Math.max(1, sum(run.map((v) => v.samples)));

  // Depots: how many of each depot's vehicles run on an average day.
  const depots = new Map();
  for (const [kind, number, model, year, depot] of state.fleet.fleet) {
    if (!depot || ['VINTAGE', 'ON TEST'].includes(D.models.get(model)?.tier)) continue;
    const d = depots.get(depot) ?? { depot, kind, fleet: 0, vehicleDays: 0, seen: 0 };
    d.fleet++;
    depots.set(depot, d);
  }
  for (const v of known) {
    const d = v.depot && depots.get(v.depot);
    if (d) { d.vehicleDays += v.days; d.seen++; }
  }
  const depotRows = [...depots.values()].filter((d) => d.fleet >= 5).map((d) => ({ ...d, util: d.vehicleDays / nDays / d.fleet })).sort(by((d) => d.util, true));

  // In the book but never on the road in this range, by model.
  const seen = new Set(known.map((v) => v.kind * 1e6 + v.number));
  const never = new Map();
  for (const [kind, number, model] of state.fleet.fleet) {
    if (seen.has(kind * 1e6 + number)) continue;
    const list = never.get(model) ?? [];
    list.push(number);
    never.set(model, list);
  }
  const neverRows = [...never].map(([id, nums]) => ({ m: D.models.get(id), nums: nums.sort((a, b) => a - b) }))
    .filter((r) => r.m).sort((a, b) => TIER[a.m.tier].rank - TIER[b.m.tier].rank || b.nums.length - a.nums.length);
  const neverTotal = sum(neverRows.filter((r) => !['VINTAGE', 'ON TEST'].includes(r.m.tier)).map((r) => r.nums.length));
  const unknown = vs.filter((v) => !v.m).sort(by((v) => v.days, true));

  return section('vehicles', `Vehicles · ${nDays} day${nDays > 1 ? 's' : ''}`, 'Records and oddities', null,
    h('div', { class: 'grid' },
      tile('Average age, whole book', `${fmt(fleetAge, 1)} y`, 'every regular vehicle, by batch year', 's3'),
      tile('Average age, on the road', `${fmt(runAge, 1)} y`, runAge < fleetAge ? 'newer ones run more' : 'older ones run more', 's3'),
      tile('Never seen', fmt(neverTotal), `regular vehicles not on the road in ${nDays} day${nDays > 1 ? 's' : ''}`, 's3'),
      tile('Not in the data', fmt(unknown.length), 'numbers on the feed that fleet.json doesn\'t know', 's3'),
      card('s6', 'Workhorses', 'Most hours on the road in this range.', list(workhorses, (v) => `${fmt(hours(v.samples))} h · ${v.days} d`)),
      card('s6', 'Longest days', 'The longest single day, first snapshot to last.', list(longest, (v) => dur(v.span))),
      card('s6', 'Line hoppers', 'Seen on the most different lines.', h('div', { class: 'list' }, hoppers.map((v) => h('div', { class: 'row' },
        h('span', { class: 'grow' }, name(v)), h('span', { class: 'r' }, `${v.lines.length} line${v.lines.length === 1 ? '' : 's'}`))))),
      card('s6', 'Oldest still running', 'The oldest regular vehicles seen, by batch year.', list(oldest, (v) => `${v.year} · ${D.thisYear - v.year} y`)),
      card('s12', 'Depots', 'Share of each depot\'s vehicles out on an average day.',
        h('div', { class: 'list' }, depotRows.map((d) => hbarRow(h('span', {}, d.depot, h('span', { class: 'tag' }, KIND[d.kind].toUpperCase())), d.util, 1, '#FFCE00', pct(d.util),
          () => [d.depot, [['#FFCE00', pct(d.util), 'out a day', 'dot'], [null, `${fmt(d.seen)} of ${fmt(d.fleet)}`, 'seen in this range']]]))),
        tableView(['Depot', 'Fleet', 'Seen', 'Out a day'], depotRows.map((d) => [d.depot, fmt(d.fleet), fmt(d.seen), pct(d.util)]))),
      card('s6', 'In the book, never on the road', `Not seen once in ${nDays} day${nDays > 1 ? 's' : ''}. After a few weeks these are likely retired, in the workshop or wrong in the data.`,
        neverRows.length ? h('div', {}, neverRows.map((r) => h('details', { class: 'more' },
          h('summary', {}, h('span', { class: 'key' }, tierDot(r.m.tier), `${r.m.name}: ${r.nums.length} of ${r.m.fleet}`)),
          h('div', {}, r.nums.map((n) => h('span', { class: 'pill' }, `#${n}`)))))) : h('div', { class: 'empty' }, 'Everything ran.')),
      card('s6', 'Not in the fleet data', 'Numbers the feed reported that fleet.json doesn\'t know. Worth adding if they keep coming back.',
        unknown.length ? h('div', { class: 'list', style: { maxHeight: '420px', overflow: 'auto' } }, unknown.map((v) => h('div', { class: 'row' },
          h('span', { class: 'grow' }, `${KIND[v.kind]} #${v.number}`), h('span', {}, v.lines.slice(0, 4).map((l) => h('span', { class: 'pill' }, l))),
          h('span', { class: 'r' }, `${v.days} d · last ${shortDay(v.last)}`)))) : h('div', { class: 'empty' }, 'None: fleet.json knows every number.'))));
}

function renderCollector() {
  const f = state.fleet, hist = state.hist;
  const good = sum(hist.days.map((d) => d[1])), failed = sum(hist.days.map((d) => d[2]));
  const lastAge = state.live.latest ? Math.round((Date.now() / 1000 - state.live.latest.ts) / 60) : null;
  return section('collector', 'Behind the scenes', 'The collector', 'A snapshot every 5 minutes, rolled up each night. Built to stay on Cloudflare\'s free plan.',
    h('div', { class: 'grid' },
      tile('Collecting since', f.first_sample ? shortDay(f.first_sample) : '–', `${fmt(f.days)} day${f.days === 1 ? '' : 's'} rolled up`),
      tile('Last snapshot', lastAge == null ? '–' : lastAge < 1 ? 'just now' : `${lastAge} min ago`, `${fmt(f.samples)} snapshots kept (4 weeks)`),
      tile('Feed failures', good + failed ? pct(failed / (good + failed), 1) : '–', `of snapshots in this range had buses or trams missing`),
      tile('Database', f.dbBytes ? `${fmt(f.dbBytes / 1048576, 0)} MB` : '–', 'of 500 MB on the free plan', 's3',
        h('div', { class: 'meter' }, h('i', { style: { width: pct(Math.min(1, (f.dbBytes ?? 0) / DB_LIMIT)) } })))));
}

// MARK: - Page

function render() {
  const app = document.getElementById('app');
  const y = scrollY;
  charts.length = 0;
  if (!state.key) return app.replaceChildren(gate());
  if (!state.fleet || !state.live || !state.hist) {
    return app.replaceChildren(h('div', { class: 'gate' }, h('p', {}, state.error ? `Couldn't load: ${state.error}` : 'Loading…'),
      state.error ? h('button', { onclick: () => load() }, 'Try again') : null));
  }
  const header = h('header', { class: 'top' }, h('div', { class: 'wrap' },
    h('div', { class: 'brand' }, 'TABOR ', h('b', {}, '·'), ' STATS'),
    h('div', { class: 'status mono' }, state.error ? `Refresh failed: ${state.error}` : `Updated ${new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`),
    chipRow(RANGES, state.range, (v) => { state.range = v; localStorage.setItem('taborStatsRange', v); state.model = null; load(['hist']); })));
  let sections;
  try {
    sections = [renderNow(), renderToday(), renderRarity(), renderHunt(), renderModels(), renderLines(), renderWhere(), renderVehicles(), renderCollector()];
  } catch (e) {
    console.error(e);
    sections = [h('div', { class: 'empty' }, `Something broke drawing the page: ${e.message}`)];
  }
  const main = h('main', { id: 'main', class: 'wrap' + (state.loading ? ' loading' : '') }, ...sections,
    h('footer', {}, 'Live positions: Warsaw open data (dane.um.warszawa.pl). Models and tiers: TABOR\'s fleet.json. ',
      'Maps: © OpenStreetMap contributors. The range above scopes everything except "Right now" and "Today".'));
  app.replaceChildren(header, main);
  scrollTo(0, y);
}

function gate() {
  const input = h('input', { type: 'password', placeholder: 'Stats key', autocomplete: 'current-password' });
  const go = () => {
    const k = input.value.trim();
    if (!k) return;
    state.key = k;
    localStorage.setItem('taborStatsKey', k);
    load();
  };
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  return h('div', { class: 'gate' }, h('div', { class: 'brand' }, 'TABOR ', h('b', {}, '·'), ' STATS'),
    h('p', {}, state.error === 'key' ? 'That key didn\'t work. Try again.' : 'Paste the stats key. This browser remembers it.'),
    input, h('button', { onclick: go }, 'Open'));
}

render();
if (state.key) load();
// The collector adds a snapshot every 5 minutes.
setInterval(() => { if (state.key && document.visibilityState === 'visible') load(['live']); }, 5 * 60 * 1000);
</script>
</body>
</html>
