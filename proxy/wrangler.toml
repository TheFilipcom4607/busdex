# The live-feed proxy (see src/index.js). Deploy from this folder:
#   npx wrangler login
#   npx wrangler secret put UM_KEY     # paste the api.um.warszawa.pl key
#   npx wrangler deploy
name = "tabor-live"
main = "src/index.js"
compatibility_date = "2026-09-01"
# One public address: the custom domain. workers.dev stays off.
workers_dev = false
routes = [{ pattern = "taborapi.thefilip.com", custom_domain = true }]

[[ratelimits]]
name = "PER_IP"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Requests, errors and timings in the dashboard (Observability tab). Kept 3 days on the free plan.
[observability.logs]
enabled = true
invocation_logs = true
