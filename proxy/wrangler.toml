# The live-feed proxy (see src/index.js). Deploy from this folder:
#   npx wrangler login
#   npx wrangler secret put DANE_TOKEN # the dane.um.warszawa.pl token (dane.um.warszawa.pl/en/key-api)
#   npx wrangler secret put UM_KEY     # the old api.um.warszawa.pl key, until the city switches it off
#   npx wrangler secret put ROUTES_UPLOAD_TOKEN  # what the routes Action sends to PUT /v1/routes
#   npx wrangler deploy
name = "tabor-live"
main = "src/index.js"
compatibility_date = "2026-09-01"
# One public address: the custom domain. workers.dev stays off.
workers_dev = false
routes = [{ pattern = "taborapi.thefilip.com", custom_domain = true }]

[[ratelimits]]
name = "PER_IP"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# routes.json for HUNT's future trails (src/routes.js). KV, not R2: one small write a day.
[[kv_namespaces]]
binding = "ROUTES"
id = "197432fc70f44a5692736b7762d8eb60"

# Requests, errors and timings in the dashboard (Observability tab). Kept 7 days on Workers Paid.
[observability.logs]
enabled = true
invocation_logs = true
